---
title: Contact PostgresCompare
description: Get in touch with the PostgresCompare team. We'd love to hear from you.
---

<section class="page-hero">
  <p class="hunk">@@ <b>contact</b> @@</p>
  <h1>Get in <span>touch</span></h1>
  <p>Have a question or feedback? We'd love to hear from you.</p>
</section>

<section class="d-section">
  <div class="dw">
    <div class="d-grid">
      <div class="cell">
        <h3>Send a message</h3>
        <form action="https://formspree.io/neil@postgrescompare.com" method="post">
          <input type="hidden" name="request_type" value="contact">
          <input type="hidden" name="_next" value="https://www.postgrescompare.com/thanks">

          <label for="name">Full name</label>
          <input type="text" name="name" id="name" placeholder="Enter your name...">

          <label for="email">Email address</label>
          <input type="email" name="email" id="email" placeholder="Enter your email..." required>

          <label for="message">Message</label>
          <textarea name="message" id="message" placeholder="Enter your message..." rows="5"></textarea>

          <button type="submit" class="d-btn d-btn-primary contact-submit">Send message</button>
        </form>
      </div>

      <div class="cell">
        <h3>Other ways to reach us</h3>
        <dl class="contact-list">
          <div>
            <dt>Email</dt>
            <dd><a href="mailto:neil@postgrescompare.com">neil@postgrescompare.com</a></dd>
          </div>
        </dl>
      </div>
    </div>
  </div>
</section>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.postgrescompare.com"},
    {"@type": "ListItem", "position": 2, "name": "Contact", "item": "https://www.postgrescompare.com/contact"}
  ]
}
</script>

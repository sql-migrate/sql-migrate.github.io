<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PostgresCompare">
  <title>PostgresCompare</title>
  <rect width="32" height="32" rx="6" fill="#336791"/>
  <!-- The mark is a plus over a minus: the diff. Drawn as rects rather than
       a text glyph so it rasterises identically everywhere. -->
  <g fill="#ffffff">
    <rect x="14.5" y="6" width="3" height="14"/>
    <rect x="9" y="11.5" width="14" height="3"/>
    <rect x="9" y="23" width="14" height="3"/>
  </g>
</svg>
